apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwi_value_assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kiwi_value_assistant
  template:
    metadata:
      labels:
        app: kiwi_value_assistant
    spec:
      containers:
        - name: kiwi_value_assistant.-container
          image: ghcr.io/camunda-community-hub/kiwi-value-assistant:latest
          ports:
            - containerPort: 8383

---
apiVersion: v1
kind: Service
metadata:
  name: kiwi_value_assistant.-service
spec:
  selector:
    app: kiwi_value_assistant
  ports:
    - protocol: TCP
      port: 8383
      targetPort: 8383
  type: ClusterIP
